# Colour palettes. One flat entry per theme; each carries its own `mode`, so
# light and dark are theme properties rather than a second axis. Consumed by
# templates as {{ (index .palette "<theme>").<key> }} and enumerated by
# .chezmoiscripts/run_onchange_generate-themes.sh.tmpl, which is what makes
# adding a theme a matter of adding a block here and nothing else.
#
# everforest and everforest-light are hand-written from the upstream Everforest
# spec (soft variant). Every other theme is converted from Omarchy's
# themes/<name>/colors.toml by /tmp/conv/convert.py. Omarchy's schema is flatter
# than this one: background/lighter_background/selection/muted/dark_foreground
# map exactly onto bg0-bg4, and the hues map straight across, but bg5, the five
# bg_<hue> tints and the grey ramp have no source and are derived by colour
# math. Validated by converting Omarchy's own everforest and diffing against the
# hand-written one below: 16 keys exact, 10 within 16/255, none further.
#
# Upstream: https://github.com/sainnhe/everforest
#           https://github.com/basecamp/omarchy (themes/, 4.0.0.alpha)


# Hand-written from the Everforest spec, soft variant. The reference theme.
