# GNOME UI keybindings, rendered by run_onchange_gnome-keybindings.sh.
#
# This began as one table feeding two renderers, GNOME here and AeroSpace on
# macOS, so the two machines could not drift. The macOS window manager has
# since been removed, so GNOME is the only consumer and the aerospace_* fields
# are gone with it. The shape still supports a second renderer if one comes
# back; nothing here is GNOME-specific except the gnome_* field names.
#
# Alt is the modifier throughout. Linux apps own Ctrl, so Alt stays clear of
# application shortcuts, and GNOME already uses it for window operations.
#
# Fields:
#   gnome_schema / gnome_key   an existing gsettings key to rebind
#   gnome_command              a command to run, bound through a custom
#                              keybinding instead of an existing key
#   gnome_binding              GTK accelerator syntax
#   note                       anything that is not configured from this file

[[keybinding]]
id = "launcher"
label = "Open the launcher"
gnome_command = "vicinae toggle"
gnome_binding = "<Alt>space"
note = "Vicinae. The Mac uses Raycast, whose hotkey lives in its own settings and cannot be set from a file."

[[keybinding]]
id = "switch-window"
label = "Switch window"
gnome_schema = "org.gnome.desktop.wm.keybindings"
gnome_key = "switch-windows"
gnome_binding = "<Alt>Tab"

[[keybinding]]
id = "close-window"
label = "Close window"
gnome_schema = "org.gnome.desktop.wm.keybindings"
gnome_key = "close"
gnome_binding = "<Alt>w"

[[keybinding]]
id = "fullscreen"
label = "Toggle fullscreen"
gnome_schema = "org.gnome.desktop.wm.keybindings"
gnome_key = "toggle-fullscreen"
gnome_binding = "<Alt>f"

[[keybinding]]
id = "workspace-prev"
label = "Previous workspace"
gnome_schema = "org.gnome.desktop.wm.keybindings"
gnome_key = "switch-to-workspace-left"
gnome_binding = "<Alt>Left"

[[keybinding]]
id = "workspace-next"
label = "Next workspace"
gnome_schema = "org.gnome.desktop.wm.keybindings"
gnome_key = "switch-to-workspace-right"
gnome_binding = "<Alt>Right"

[[keybinding]]
id = "screenshot"
label = "Screenshot"
gnome_schema = "org.gnome.shell.keybindings"
gnome_key = "show-screenshot-ui"
gnome_binding = "<Alt>s"

[[keybinding]]
id = "lock-screen"
label = "Lock the screen"
gnome_schema = "org.gnome.settings-daemon.plugins.media-keys"
gnome_key = "screensaver"
gnome_binding = "<Alt>x"

[[keybinding]]
id = "terminal"
label = "Open a terminal"
gnome_command = "kitty"
gnome_binding = "<Alt>Return"

# Workspaces 1-9. GNOME needs static workspaces for these to address
# anything, which the keybinding script sets up before applying them.
[workspaces]
count = 9
gnome_switch_binding_prefix = "<Alt>"
gnome_move_binding_prefix = "<Alt><Shift>"
