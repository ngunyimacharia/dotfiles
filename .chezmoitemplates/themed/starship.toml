# Starship prompt. Shared body for the dark, light and default copies.
# The template context is a palette mode map from .chezmoidata/palette.toml,
# so colors are referenced as {{ ".green" }}, {{ ".fg" }} and so on.
# ~/.config/starship.toml

"$schema" = "https://starship.rs/config-schema.json"

# Headroom over the 500ms default. Nothing in this prompt should need it now
# that php and node read project files instead of shelling out to lerd shims,
# but git in a large repo can still spike, and a timed-out module prints a
# warning line that scrolls the prompt rather than just rendering empty.
command_timeout = 1000

# Everforest theme for Starship
format = """
$os\
$username\
$directory\
$aws\
$git_branch\
$git_status\
$git_state\
$git_metrics\
${custom.node}\
$python\
$rust\
$golang\
$lua\
${custom.php}\
$cmd_duration\
$fill\
$time
$character
"""

[os]
disabled = false
style = "bold {{ .green }}"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[username]
show_always = true
style_user = "bold {{ .green }}"
style_root = "bold {{ .red }}"
format = "[$user]($style) "

[directory]
truncation_length = 1
truncate_to_repo = true
style = "bold {{ .blue }}"
format = "[$path]($style) "
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold {{ .purple }}"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold {{ .fg }}"
format = "([$all_status$ahead_behind]($style) )"

[git_state]
style = "bold {{ .red }}"
format = "([$state( $progress_current/$progress_total)]($style) )"

[git_metrics]
disabled = false
format = "([+$added]($added_style) [-$deleted]($deleted_style) )"

[cmd_duration]
min_time = 500
style = "bold {{ .blue }}"
format = "took [$duration]($style) "

[aws]
symbol = " "
style = "bold {{ .green }}"
format = "[$symbol]($style)[$profile@$region]($style) "

# Same story as php below: the `node` on PATH is a shim that execs `lerd node`,
# a container round-trip measured at ~480ms against the 500ms command_timeout.
# It times out under any load, and because starship renders modules in
# parallel it starved custom.php into timing out too. custom.node reads the
# version from project files instead (~10ms).
[nodejs]
disabled = true

[custom.node]
command = "~/bin/starship-node-version"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".nvmrc", ".node-version", ".lerd.yaml"]
detect_folders = ["node_modules"]
symbol = " "
style = "bold {{ .green }}"
format = "[$symbol$output]($style) "

[python]
symbol = " "
style = "bold {{ .blue }}"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "bold {{ .orange }}"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold {{ .aqua }}"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "bold {{ .blue }}"
format = "[$symbol$version]($style) "

# The built-in php module runs the `php` on PATH, which here is a shim that
# execs `lerd php` — a container round-trip that overruns starship's 500ms
# command_timeout when the machine is busy. custom.php reads the version from
# project files instead (~4ms).
[php]
disabled = true

[custom.php]
command = "~/bin/starship-php-version"
detect_extensions = ["php"]
detect_files = ["composer.json", ".php-version", ".lerd.yaml"]
symbol = " "
style = "bold {{ .fg }}"
format = "[$symbol$output]($style) "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
