name: dynamodb-local
image: docker.io/amazon/dynamodb-local:latest
description: Persistent local DynamoDB service
ports:
  - 8000:8000
data_dir: /home/dynamodblocal/data
chown_data: true
exec: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
env_vars:
  - DYNAMODB_ENDPOINT=http://lerd-dynamodb-local:8000
env_detect:
  key: DYNAMODB_ENDPOINT
  value_prefix: "http://"
